<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Organize projetos, divisões e tarefas em um só lugar.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307111f'/%3E%3Cpath d='M18 19h28M18 32h19M18 45h24' stroke='%2359e1d3' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>Ideia em Fluxo</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#0d1929;--panel-2:#122239;--raised:#172941;--ink:#f6f8fc;--muted:#9aa9bd;--line:#253956;--cyan:#59e1d3;--coral:#ff725e;--violet:#9a8cff;--yellow:#ffd166;--danger:#ff7b7b;--shadow:0 20px 55px #02060d70;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 96% -8%,#17406b 0,transparent 30rem),var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.shell{max-width:560px;min-height:100vh;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(112px + env(safe-area-inset-bottom))}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:-.025em}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--cyan);color:#05231f;box-shadow:0 10px 30px #59e1d33a}.local-pill{font-size:.72rem;font-weight:800;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border:1px solid var(--line);border-radius:99px;background:#081321aa}.eyebrow{margin:0 0 9px;color:var(--cyan);font-size:.76rem;text-transform:uppercase;letter-spacing:.16em;font-weight:850}.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}.hero h1{font-size:clamp(2.25rem,11vw,3.4rem);line-height:.96;letter-spacing:-.065em;margin:0;max-width:390px}.count{font-size:.82rem;color:var(--muted);white-space:nowrap;margin-bottom:4px}.project-list{display:grid;gap:15px}.project-card{--accent:var(--cyan);position:relative;width:100%;min-height:174px;padding:21px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,var(--panel-2),var(--panel));text-align:left;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:.2s transform,.2s border-color}.project-card:hover{transform:translateY(-3px);border-color:#456080}.project-card:active{transform:scale(.985)}.project-card::after{content:"";position:absolute;width:165px;height:165px;right:-87px;top:-91px;border-radius:50%;background:var(--accent);opacity:.16}.card-top{display:flex;align-items:start;justify-content:space-between}.project-icon{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-size:1.25rem;font-weight:850}.open-arrow{font-size:1.35rem;color:var(--muted)}.project-card h2{font-size:1.25rem;letter-spacing:-.03em;margin:26px 0 7px}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.84rem}.progress{display:block;height:5px;background:#fff1;border-radius:99px;overflow:hidden;margin-top:16px}.progress span{display:block;height:100%;border-radius:inherit;background:var(--accent)}.fab{position:fixed;z-index:8;right:max(20px,calc((100vw - 560px)/2 + 20px));bottom:calc(22px + env(safe-area-inset-bottom));height:58px;border:0;border-radius:18px;padding:0 20px;display:flex;align-items:center;gap:10px;background:var(--cyan);color:#05231f;font-weight:850;box-shadow:0 15px 38px #59e1d340;cursor:pointer}.fab .plus{font-size:1.5rem;font-weight:500;line-height:1}.empty{padding:42px 24px;border:1px dashed #37506e;border-radius:24px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:7px}.project-head{display:flex;align-items:start;gap:14px;margin-bottom:25px}.back,.icon-btn{border:1px solid var(--line);background:var(--panel);cursor:pointer}.back{flex:0 0 auto;width:43px;height:43px;border-radius:14px;font-size:1.2rem}.project-title{flex:1;min-width:0}.project-title h1{font-size:2.15rem;line-height:1.02;letter-spacing:-.055em;margin:3px 0 8px;overflow-wrap:anywhere}.summary{font-size:.86rem;color:var(--muted)}.division-list{display:grid;gap:12px}.division{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--panel-2),var(--panel));overflow:hidden}.division-trigger{width:100%;border:0;background:transparent;padding:18px;display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer}.division-badge{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:#59e1d31b;color:var(--cyan);font-weight:900}.division-copy{flex:1}.division-name{display:block;font-size:1rem;font-weight:800}.division-count{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}.chevron{color:var(--muted);font-size:1.15rem;transition:.2s transform}.division.open .chevron{transform:rotate(180deg)}.task-wrap{display:none;border-top:1px solid var(--line);padding:6px 12px 12px}.division.open .task-wrap{display:block}.task-row{display:flex;gap:9px;align-items:center;border-radius:13px;padding:9px 7px}.task-row+.task-row{border-top:1px solid #25395688}.check{appearance:none;width:22px;height:22px;border:2px solid #49607d;border-radius:7px;display:grid;place-content:center;cursor:pointer;flex:0 0 auto}.check:checked{background:var(--cyan);border-color:var(--cyan)}.check:checked::after{content:"✓";color:#05231f;font-weight:950;font-size:.85rem}.task-open{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:7px 4px;cursor:pointer}.task-open strong{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-open small{display:block;color:var(--muted);font-size:.76rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-row.done .task-open strong{text-decoration:line-through;color:var(--muted)}.mini-add{width:100%;border:1px dashed #3c5677;background:#0b1727;color:var(--cyan);padding:11px;border-radius:12px;margin-top:7px;font-weight:800;cursor:pointer}.section-add{width:100%;border:1px dashed #3c5677;background:#0b1727;color:var(--cyan);padding:16px;border-radius:18px;margin-top:13px;font-weight:850;cursor:pointer}.crumb{color:var(--cyan);font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;font-weight:850}.toast{position:fixed;z-index:30;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f4f7fb;color:#091321;border-radius:99px;padding:11px 17px;font-weight:800;font-size:.83rem;white-space:nowrap;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}dialog{width:min(calc(100% - 26px),500px);border:1px solid #334967;padding:0;border-radius:26px;background:var(--panel);color:var(--ink);box-shadow:0 28px 100px #000b;max-height:calc(100vh - 38px)}dialog::backdrop{background:#020812c9;backdrop-filter:blur(5px)}.modal{padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:22px}.modal-head h2{font-size:1.45rem;letter-spacing:-.035em;margin:4px 0 0}.close{width:38px;height:38px;border-radius:12px;font-size:1.25rem}.field{display:grid;gap:8px;margin:17px 0}.field label{font-size:.82rem;color:var(--muted);font-weight:750}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#071321;color:var(--ink);border-radius:13px;padding:13px 14px;font-size:1rem}.field textarea{min-height:130px;resize:vertical;line-height:1.5}.colors{display:flex;gap:12px}.color-pick{appearance:none;width:34px;height:34px;border-radius:50%;border:4px solid transparent;background:var(--swatch);cursor:pointer}.color-pick:checked{border-color:var(--ink);box-shadow:0 0 0 2px var(--swatch)}.actions{display:flex;gap:10px;margin-top:23px}.primary,.danger{min-height:48px;border-radius:14px;padding:0 16px;font-weight:850;cursor:pointer}.primary{flex:1;border:0;background:var(--cyan);color:#05231f}.danger{border:0;background:#ff7b7b1c;color:var(--danger)}.task-status{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#071321}.task-status input{width:22px;height:22px;accent-color:var(--cyan)}
    @media(min-width:820px){.shell{max-width:1060px;padding-left:38px;padding-right:38px}.project-list{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{max-width:none}.fab{right:max(32px,calc((100vw - 1060px)/2 + 38px))}.division-list{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.section-add{min-height:76px;margin-top:0}.project-title h1{font-size:2.7rem}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="shell" id="app"></main>
  <button class="fab" id="fab"><span class="plus">+</span><span id="fabLabel">Novo projeto</span></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"><form method="dialog" class="modal" id="modalForm"></form></dialog>
  <script>
  (()=>{
    const STORAGE='ideia-em-fluxo-v2',palette=['#59e1d3','#ff725e','#9a8cff','#ffd166'];
    localStorage.removeItem('ideia-em-fluxo-v1');
    let state={projects:[],current:null,openDivisions:[]};
    try{state.projects=JSON.parse(localStorage.getItem(STORAGE))||[]}catch{state.projects=[]}
    const app=document.querySelector('#app'),fab=document.querySelector('#fab'),fabLabel=document.querySelector('#fabLabel'),dialog=document.querySelector('#dialog'),form=document.querySelector('#modalForm'),toast=document.querySelector('#toast');
    const uid=p=>p+Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const save=()=>{localStorage.setItem(STORAGE,JSON.stringify(state.projects));render()},notify=msg=>{toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)},getProject=()=>state.projects.find(p=>p.id===state.current),stats=p=>{const tasks=p.divisions.flatMap(d=>d.tasks);return {total:tasks.length,done:tasks.filter(t=>t.done).length}};
    const header=()=>`<header class="topbar"><div class="brand"><span class="mark" aria-hidden="true">✦</span> Ideia em Fluxo</div><span class="local-pill">salvo neste aparelho</span></header>`;
    function render(){const p=getProject();p?renderProject(p):renderHome()}
    function renderHome(){fabLabel.textContent='Novo projeto';app.innerHTML=header()+`<section class="hero" aria-labelledby="pageTitle"><div><p class="eyebrow">Seu espaço</p><h1 id="pageTitle">Projetos em movimento.</h1></div><span class="count">${state.projects.length} ${state.projects.length===1?'projeto':'projetos'}</span></section><section class="project-list" aria-label="Projetos">${state.projects.length?state.projects.map(projectCard).join(''):`<div class="empty"><strong>Sua primeira ideia começa aqui.</strong>Crie um projeto e separe o trabalho em partes menores.</div>`}</section>`;app.querySelectorAll('[data-project]').forEach(el=>el.onclick=()=>{state.current=el.dataset.project;state.openDivisions=[];render();scrollTo({top:0,behavior:'smooth'})})}
    function projectCard(p){const s=stats(p),pct=s.total?Math.round(s.done/s.total*100):0;return `<button class="project-card" style="--accent:${p.color}" data-project="${p.id}"><span class="card-top"><span class="project-icon">${p.icon||'◰'}</span><span class="open-arrow">↗</span></span><h2>${esc(p.name)}</h2><span class="meta"><span>${p.divisions.length} ${p.divisions.length===1?'divisão':'divisões'}</span><span>${s.done} de ${s.total} tarefas</span></span><span class="progress" aria-label="${pct}% concluído"><span style="width:${pct}%"></span></span></button>`}
    function renderProject(p){const s=stats(p);fabLabel.textContent='Nova divisão';app.innerHTML=header()+`<section class="project-head"><button class="back" id="back" aria-label="Voltar">←</button><div class="project-title"><span class="crumb">Projeto</span><h1>${esc(p.name)}</h1><span class="summary">${s.done} de ${s.total} tarefas concluídas</span></div></section><section class="division-list" aria-label="Divisões do projeto">${p.divisions.map(d=>divisionCard(d)).join('')}<button class="section-add" id="sectionAdd">+ Adicionar divisão</button></section>`;app.querySelector('#back').onclick=()=>{state.current=null;render()};app.querySelector('#sectionAdd').onclick=openDivisionForm;app.querySelectorAll('[data-division-toggle]').forEach(b=>b.onclick=()=>{const id=b.dataset.divisionToggle;state.openDivisions=state.openDivisions.includes(id)?state.openDivisions.filter(x=>x!==id):[...state.openDivisions,id];render()});app.querySelectorAll('[data-add-task]').forEach(b=>b.onclick=()=>openTaskForm(b.dataset.addTask));app.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>openTaskDetail(b.dataset.division,b.dataset.task));app.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{const d=p.divisions.find(x=>x.id===c.dataset.division),t=d.tasks.find(x=>x.id===c.dataset.check);t.done=c.checked;save();notify(c.checked?'Tarefa concluída':'Tarefa reaberta')})}
    function divisionCard(d){const open=state.openDivisions.includes(d.id),done=d.tasks.filter(t=>t.done).length;return `<article class="division ${open?'open':''}"><button class="division-trigger" data-division-toggle="${d.id}" aria-expanded="${open}"><span class="division-badge">${esc(d.name).slice(0,1).toUpperCase()}</span><span class="division-copy"><span class="division-name">${esc(d.name)}</span><span class="division-count">${done} de ${d.tasks.length} concluídas</span></span><span class="chevron">⌄</span></button><div class="task-wrap">${d.tasks.length?d.tasks.map(t=>`<div class="task-row ${t.done?'done':''}"><input class="check" type="checkbox" ${t.done?'checked':''} data-check="${t.id}" data-division="${d.id}" aria-label="Marcar ${esc(t.title)} como concluída"><button class="task-open" data-task="${t.id}" data-division="${d.id}"><strong>${esc(t.title)}</strong><small>${esc(t.description||'Sem detalhes ainda')}</small></button></div>`).join(''):`<div class="empty"><strong>Nenhuma tarefa.</strong>Adicione o próximo passo desta divisão.</div>`}<button class="mini-add" data-add-task="${d.id}">+ Nova tarefa</button></div></article>`}
    function modalShell(kicker,title,body,actions=''){form.innerHTML=`<div class="modal-head"><div><span class="crumb">${kicker}</span><h2>${title}</h2></div><button type="button" class="icon-btn close" aria-label="Fechar">×</button></div>${body}${actions}`;form.querySelector('.close').onclick=()=>dialog.close();dialog.showModal()}
    function openProjectForm(){modalShell('Novo projeto','Qual ideia vai ganhar forma?',`<div class="field"><label for="name">Nome do projeto</label><input id="name" name="name" required maxlength="60" placeholder="Ex.: Loja virtual"></div><div class="field"><label>Cor do projeto</label><div class="colors">${palette.map((c,i)=>`<input class="color-pick" type="radio" name="color" value="${c}" style="--swatch:${c}" aria-label="Cor ${i+1}" ${i===0?'checked':''}>`).join('')}</div></div><div class="actions"><button class="primary">Criar projeto</button></div>`);form.onsubmit=e=>{e.preventDefault();const data=new FormData(form),name=data.get('name').trim();if(!name)return;const p={id:uid('p'),name,color:data.get('color'),icon:'◰',divisions:[]};state.projects.unshift(p);state.current=p.id;dialog.close();save();notify('Projeto criado')};setTimeout(()=>form.name.focus(),50)}
    function openDivisionForm(){modalShell('Nova divisão','Separe uma parte do projeto',`<div class="field"><label for="divisionName">Nome da divisão</label><input id="divisionName" name="name" required maxlength="50" placeholder="Ex.: Front-end, Pesquisa, Dados"></div><div class="actions"><button class="primary">Adicionar divisão</button></div>`);form.onsubmit=e=>{e.preventDefault();const name=new FormData(form).get('name').trim();if(!name)return;const d={id:uid('d'),name,tasks:[]};getProject().divisions.push(d);state.openDivisions.push(d.id);dialog.close();save();notify('Divisão adicionada')};setTimeout(()=>form.name.focus(),50)}
    function openTaskForm(divisionId){modalShell('Nova tarefa','Defina o próximo passo',`<div class="field"><label for="taskTitle">Título</label><input id="taskTitle" name="title" required maxlength="90" placeholder="O que precisa ser feito?"></div><div class="field"><label for="taskDescription">Explicação</label><textarea id="taskDescription" name="description" maxlength="1000" placeholder="Descreva o resultado esperado, cuidados e referências."></textarea></div><div class="actions"><button class="primary">Criar tarefa</button></div>`);form.onsubmit=e=>{e.preventDefault();const data=new FormData(form),title=data.get('title').trim();if(!title)return;const d=getProject().divisions.find(x=>x.id===divisionId);d.tasks.push({id:uid('t'),title,description:data.get('description').trim(),done:false});dialog.close();save();notify('Tarefa criada')};setTimeout(()=>form.title.focus(),50)}
    function openTaskDetail(divisionId,taskId){const d=getProject().divisions.find(x=>x.id===divisionId),t=d.tasks.find(x=>x.id===taskId);modalShell(d.name,'Detalhes da tarefa',`<div class="field"><label for="detailTitle">Título</label><input id="detailTitle" name="title" required maxlength="90" value="${esc(t.title)}"></div><div class="field"><label for="detailDescription">O que deve ser feito</label><textarea id="detailDescription" name="description" maxlength="1000" placeholder="Adicione os detalhes desta tarefa.">${esc(t.description)}</textarea></div><label class="task-status"><input type="checkbox" name="done" ${t.done?'checked':''}> Tarefa concluída</label>`,`<div class="actions"><button type="button" class="danger" id="deleteTask">Excluir</button><button class="primary">Salvar alterações</button></div>`);form.onsubmit=e=>{e.preventDefault();const data=new FormData(form);t.title=data.get('title').trim();t.description=data.get('description').trim();t.done=data.get('done')==='on';dialog.close();save();notify('Tarefa atualizada')};form.querySelector('#deleteTask').onclick=()=>{if(confirm('Excluir esta tarefa?')){d.tasks=d.tasks.filter(x=>x.id!==taskId);dialog.close();save();notify('Tarefa excluída')}}}
    fab.onclick=()=>getProject()?openDivisionForm():openProjectForm();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
    function registerWebMCP(){const ctx=document.modelContext;if(!ctx?.registerTool)return;[{name:'create_project',title:'Criar projeto',description:'Cria um novo projeto no organizador.',inputSchema:{type:'object',properties:{name:{type:'string'},color:{type:'string'}},required:['name'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:({name,color})=>{if(!name?.trim())throw new Error('Nome obrigatório');const p={id:uid('p'),name:name.trim(),color:palette.includes(color)?color:palette[0],icon:'◰',divisions:[]};state.projects.unshift(p);save();return {id:p.id,name:p.name}}},{name:'list_projects',title:'Listar projetos',description:'Lista os projetos e seus totais de tarefas.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>state.projects.map(p=>({id:p.id,name:p.name,...stats(p)}))}].forEach(t=>Promise.resolve(ctx.registerTool(t)).catch(()=>{}))}
    render();registerWebMCP();
  })();
  </script>
</body>
</html>
